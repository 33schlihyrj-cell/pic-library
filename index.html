<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Vault</title>

<style>
:root {
    --bg: #0b1020;
    --panel: #141c30;
    --panel2: #1b2740;
    --text: #eef3ff;
    --muted: #9aa8c4;
    --accent: #7c5cff;
    --accent2: #27d7b5;
    --danger: #ff5577;
    --border: #2b3855;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

button, input, select { font: inherit; }

button {
    border: 0;
    border-radius: 10px;
    padding: 10px 14px;
    color: white;
    background: var(--accent);
    cursor: pointer;
    transition: 0.15s;
}

button:hover { filter: brightness(1.15); }
button:disabled { opacity: 0.55; cursor: wait; }

button.secondary {
    background: var(--panel2);
    border: 1px solid var(--border);
}

button.danger { background: #8e2943; }
button.green { background: #087e70; }

input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    background: #0d1425;
    border: 1px solid var(--border);
    color: white;
    outline: none;
}

input:focus, select:focus { border-color: var(--accent); }

header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    background: #10182b;
    position: sticky;
    top: 0;
    z-index: 5;
}

.header-inner {
    max-width: 1250px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.logo { font-size: 23px; font-weight: 800; }
.logo span { color: var(--accent2); }

main {
    max-width: 1250px;
    margin: auto;
    padding: 22px;
}

h1, h2, h3 { margin-top: 0; }

.subtitle {
    color: var(--muted);
    line-height: 1.5;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 22px 0;
}

.tab-button.active {
    background: var(--accent2);
    color: #061b1b;
    font-weight: bold;
}

.tab { display: none; }
.tab.active { display: block; }

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}

.upload-area {
    border: 2px dashed #45547a;
    padding: 35px 15px;
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    background: #10192c;
}

.upload-area.dragging {
    border-color: var(--accent2);
    background: #132d34;
}

.upload-area p { color: var(--muted); }

.row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

.row > input { flex: 1; min-width: 180px; }
.searchbar { margin-bottom: 18px; }

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 15px;
}

.image-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    min-width: 0;
}

.image-card img {
    width: 100%;
    height: 175px;
    display: block;
    object-fit: cover;
    background: #080c16;
